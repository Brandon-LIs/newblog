name: 友链申请自动处理

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 0:00 = 北京时间 8:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-approve 24-48h applications
        run: |
          curl -s "https://apii.oopss.top/api/friend-apply/auto" \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" || true