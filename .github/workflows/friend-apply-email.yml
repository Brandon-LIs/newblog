name: 友链申请邮件处理

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  send-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pending applications
        run: |
          curl -s "https://quickform.cn/api/fxchofgbap/all" > /tmp/applications.json
          echo "apps=$(cat /tmp/applications.json)" >> $GITHUB_OUTPUT

      - name: Process and send emails
        env:
          SMTP_SERVER: smtp.qq.com
          SMTP_PORT: '465'
          SMTP_USER: liboning2011@vip.qq.com
          SMTP_PASSWORD: ftmhbcncfbjtcehj
          ADMIN_EMAIL: bcihal@qq.com
        run: |
          node -e "
          const fs = require('fs');
          const apps = JSON.parse(fs.readFileSync('/tmp/applications.json','utf8'));
          const list = Array.isArray(apps) ? apps : (apps.data || []);
          const pending = list.filter(a => !a._emailSent && a.status === 'pending');
          if (!pending.length) { console.log('No pending applications'); process.exit(0); }
          const { execSync } = require('child_process');
          for (const app of pending) {
            // Send admin email
            const approveUrl = 'https://api.oopss.top/api/friend-apply/approve?token=' + app.id;
            const rejectUrl = 'https://api.oopss.top/api/friend-apply/reject?token=' + app.id;
            const adminHtml = \`<!DOCTYPE html><html><body style="margin:0;padding:0;background:#f5f7fa;font-family:sans-serif">
              <table width="100%" cellpadding="0" cellspacing="0" style="padding:24px"><tr><td align="center">
              <table width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#fff;border-radius:16px;overflow:hidden">
              <tr><td style="background:linear-gradient(135deg,#12affa,#0598df);padding:24px;text-align:center">
                <div style="color:#fff;font-size:20px;font-weight:700">友链自助申请系统</div>
                <div style="color:rgba(255,255,255,.8);font-size:13px;margin-top:4px">新友链申请</div>
              </td></tr>
              <tr><td style="padding:24px">
                <div style="font-size:15px;font-weight:600;margin-bottom:16px">\${app.name} 申请与您交换友链</div>
                <table style="font-size:14px;line-height:2">
                  <tr><td style="color:#6b7280;width:90px">博客名称</td><td><strong>\${app.name}</strong></td></tr>
                  <tr><td style="color:#6b7280">网站地址</td><td><a href=\"\${app.website}\" style="color:#12affa">\${app.website}</a></td></tr>
                  <tr><td style="color:#6b7280">简介</td><td>\${app.description || '—'}</td></tr>
                  <tr><td style="color:#6b7280">友链页</td><td><a href=\"\${app.friendLink}\" style="color:#12affa">\${app.friendLink}</a></td></tr>
                  <tr><td style="color:#6b7280">RSS</td><td>\${app.rss || '—'}</td></tr>
                  <tr><td style="color:#6b7280">头像</td><td>\${app.avatar ? '✅' : '❌'}</td></tr>
                  <tr><td style="color:#6b7280">申请人邮箱</td><td>\${app.email}</td></tr>
                </table>
                <div style="margin:20px 0;padding:12px 16px;background:#f8fafc;border-radius:8px;font-size:13px;line-height:1.8">
                  <strong>初审结果：</strong><br>
                  友链页检查：\${app.linkOk ? '✅ 已找到我的友链' : '❌ 未找到'}<br>
                  头像检查：\${app.avatarOk ? '✅ 可访问' : '❌ 不可用'}<br>
                  RSS 检查：\${app.rssOk ? '✅ 可访问' : '❌ 不可用或未提供'}
                </div>
                <table width="100%"><tr>
                  <td width="50%" style="padding-right:6px"><a href=\"\${approveUrl}\" style="display:block;text-align:center;padding:14px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;text-decoration:none;border-radius:10px;font-size:15px;font-weight:600">✅ 同意申请</a></td>
                  <td width="50%" style="padding-left:6px"><a href=\"\${rejectUrl}\" style="display:block;text-align:center;padding:14px;background:#f43f5e;color:#fff;text-decoration:none;border-radius:10px;font-size:15px;font-weight:600">❌ 拒绝申请</a></td>
                </tr></table>
                <div style="margin-top:16px;font-size:12px;color:#9ca3af;text-align:center">24 小时内未操作将自动同意</div>
              </td></tr></table></td></tr></table></body></html>\`;

            const sendmail = require('sendmail')();
            sendmail({
              from: 'liboning2011@vip.qq.com',
              to: process.env.ADMIN_EMAIL,
              subject: '【友链申请】' + app.name + ' 申请友链',
              html: adminHtml,
              smtp: {
                host: process.env.SMTP_SERVER,
                port: parseInt(process.env.SMTP_PORT),
                secure: true,
                auth: { user: process.env.SMTP_USER, pass: process.env.SMTP_PASSWORD },
              }
            }, function(err) {
              if (err) console.log('Send error:', err);
              else console.log('Email sent for ' + app.name);
            });
          }
          "
