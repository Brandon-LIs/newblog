name: 友链文章抓取与健康检查

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch friend articles
        run: node scripts/fetch-friend-feed.js

      - name: Commit and push
        run: |
          git config user.name "friend-feed-bot"
          git config user.email "friend-feed-bot@users.noreply.github.com"
          git add data/friend-articles.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: 更新友链文章"
            git push
          fi

  health-check:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 0 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Health check
        id: health
        continue-on-error: true
        run: |
          node -e "
            const fs = require('fs');
            const friends = JSON.parse(fs.readFileSync('data/friends.json','utf8'));
            let failed = [];
            (async () => {
              for (const f of friends) {
                try {
                  const ctrl = new AbortController();
                  const t = setTimeout(() => ctrl.abort(), 10000);
                  const r = await fetch(f.website, { signal: ctrl.signal, method: 'HEAD' });
                  clearTimeout(t);
                  if (!r.ok && r.status !== 403) failed.push(f.title + ' (' + f.website + ') - HTTP ' + r.status);
                } catch(e) {
                  failed.push(f.title + ' (' + f.website + ') - ' + e.message);
                }
              }
              if (failed.length) {
                const msg = failed.join('\n');
                require('fs').writeFileSync('/tmp/health-errors.txt', msg);
                console.log('FAILED:', msg);
                process.exit(1);
              } else {
                console.log('All friends healthy');
              }
            })();
          "

      - name: Send email on failure
        if: failure() && steps.health.outcome == 'failure'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.qq.com
          server_port: 465
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: '友链健康检查异常'
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_USER }}
          body: |
            以下友链无法正常访问：

            $(cat /tmp/health-errors.txt 2>/dev/null || echo '获取失败详情失败')
