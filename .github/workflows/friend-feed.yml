name: 友链文章抓取与健康检查

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch friend articles
        run: node scripts/fetch-friend-feed.js

      - name: Commit and push to newblog
        id: commit
        run: |
          git config user.name "friend-feed-bot"
          git config user.email "friend-feed-bot@users.noreply.github.com"
          git add data/friend-articles.json
          if git diff --cached --quiet; then echo "no changes"; echo "has_changes=false" >> $GITHUB_OUTPUT; exit 0; fi
          git commit -m "chore: 更新友链文章"
          git pull --rebase origin main || true
          git push
          echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Push to friend-data repo
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/Brandon-LIs/friend-data.git /tmp/friend-data
          cp data/friend-articles.json /tmp/friend-data/
          cd /tmp/friend-data
          git config user.name "friend-feed-bot"
          git config user.email "friend-feed-bot@users.noreply.github.com"
          git add friend-articles.json
          git commit -m "chore: 更新友链文章" || true
          git pull --rebase origin main || true
          git push

      - name: Purge jsdelivr cache
        if: steps.commit.outputs.has_changes == 'true'
        run: curl -s "https://purge.jsdelivr.net/gh/Brandon-LIs/friend-data@main/friend-articles.json"

      - name: Feishu notification on failure
        if: failure()
        env:
          FEISHU_URL: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          MSG='{"msg_type":"interactive","card":{"header":{"title":{"tag":"plain_text","content":"⚠️ 友链抓取失败"},"template":"red"},"elements":[{"tag":"markdown","content":"友链抓取失败，请检查日志。\n\n[查看详情](https://github.com/Brandon-LIs/newblog/actions)"}]}}'
          curl -s -X POST "$FEISHU_URL" -H "Content-Type: application/json" -d "$MSG"