name: 友链文章抓取

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch friend articles
        run: node scripts/fetch-friend-feed.js

      - name: Push to friend-data
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/Brandon-LIs/friend-data.git /tmp/fd
          cp data/friend-articles.json /tmp/fd/
          cd /tmp/fd && git config user.name "bot" && git config user.email "bot@noreply"
          git add friend-articles.json
          git commit -m "update" || true
          git pull --rebase origin main || true
          git push || true

      - name: Deploy to Cloudflare Pages
        run: |
          mkdir -p /tmp/pages-deploy
          cp data/friend-articles.json /tmp/pages-deploy/
          CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }} npx wrangler pages deploy /tmp/pages-deploy --project-name friend-data --branch main || true

      - name: Purge jsdelivr
        run: curl -s "https://purge.jsdelivr.net/gh/Brandon-LIs/friend-data@main/friend-articles.json"