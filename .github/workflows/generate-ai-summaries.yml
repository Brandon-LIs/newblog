name: Generate AI Summaries

on:
  push:
    branches: [main]
    paths:
      - 'blog/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate AI Summaries
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          XUNFEI_API_KEY: ${{ secrets.XUNFEI_API_KEY }}
        run: node scripts/gen-ai-summaries.mjs

      - name: Submit new posts to Baidu
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'blog/*.md' 'blog/*.mdx' || echo "")
          if [ -z "$CHANGED" ]; then
            echo "无博客文件变更，跳过百度推送"
            exit 0
          fi

          while read -r FILE; do
            [ -z "$FILE" ] && continue
            SLUG=$(sed -n 's/^slug: *\(.*\)/\1/p' "$FILE" | head -1 | sed "s/^['\"]//;s/['\"]$//")
            [ -z "$SLUG" ] && SLUG=$(basename "$FILE" .md | sed 's/^[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}-//' | sed 's/\.mdx$//')
            [ -z "$SLUG" ] && continue
            echo "https://blog.oopss.top/blog/$SLUG" >> /tmp/baidu_urls.txt
            echo "添加: https://blog.oopss.top/blog/$SLUG"
          done <<< "$CHANGED"

          if [ ! -s /tmp/baidu_urls.txt ]; then
            echo "无有效 URL，跳过"
            exit 0
          fi

          RESPONSE=$(curl -s -X POST "http://data.zz.baidu.com/urls?site=https://blog.oopss.top&token=nij74RncMLPVNRnq" \
            -H "Content-Type: text/plain" \
            --data-binary @/tmp/baidu_urls.txt)
          echo "百度推送结果: $RESPONSE"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for i in 1 2 3 4 5; do
            # 基于最新 main 重新生成（幂等），避免与其他 Action 并发提交冲突
            git fetch origin main
            git reset --hard origin/main
            node scripts/gen-ai-summaries.mjs

            git add static/ai-summaries.json
            if git diff --cached --quiet; then
              echo "摘要无变化"
              exit 0
            fi
            git commit -m "chore: 自动更新 AI 摘要"
            if git push origin main; then
              echo "✅ 已提交更新"
              exit 0
            fi
            echo "第 $i 次推送失败（可能并发冲突），重试..."
            sleep 2
          done
          echo "多次推送失败" >&2
          exit 1
