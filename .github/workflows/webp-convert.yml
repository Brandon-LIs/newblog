name: Convert Images to WebP

on:
  push:
    branches: [main]
    paths:
      - 'blog/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install webp (cwebp)
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Convert images to webp
        env:
          IMG_TOKEN: ${{ secrets.IMG_TOKEN }}
        run: node scripts/convert-images-webp.mjs

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain blog/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add blog/
            git commit -m "chore: 博客图片自动转换为 webp"
            git push
            echo "✅ 已提交更新"
          else
            echo "无图片需转换"
          fi
