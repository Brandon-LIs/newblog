<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brandon's Blog 图床</title>
<style>
  :root {
    --primary: #12affa;
    --primary-dark: #0598df;
    --bg: #f5f8fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --ok: #10b981;
    --danger: #ef4444;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(900px 500px at 5% -5%, rgba(18,175,250,.18), transparent 60%),
      radial-gradient(700px 400px at 105% 105%, rgba(251,114,153,.12), transparent 60%),
      var(--bg);
    color: var(--text);
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 16px 60px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  header img { width: 42px; height: 42px; border-radius: 50%; box-shadow: 0 3px 10px rgba(18,175,250,.25); }
  header .t { font-size: 20px; font-weight: 800; }
  header .s { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .dropzone {
    border: 2px dashed #cbd5e1; border-radius: var(--radius);
    background: rgba(255,255,255,.7); padding: 48px 20px;
    text-align: center; cursor: pointer;
    transition: all .2s; position: relative;
  }
  .dropzone:hover, .dropzone.over { border-color: var(--primary); background: rgba(18,175,250,.05); }
  .dropzone .big { font-size: 44px; }
  .dropzone h2 { margin: 10px 0 6px; font-size: 17px; }
  .dropzone p { margin: 0; color: var(--muted); font-size: 13px; }
  .dropzone .btn-select {
    display: inline-block; margin-top: 16px; padding: 10px 22px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600;
    transition: transform .15s, box-shadow .2s;
  }
  .dropzone:hover .btn-select { box-shadow: 0 6px 18px rgba(18,175,250,.35); transform: translateY(-1px); }

  .queue { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
  .item {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; display: flex; align-items: center; gap: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
  }
  .item.uploading { opacity: .8; }
  .item .thumb {
    width: 48px; height: 48px; border-radius: 8px; object-fit: cover;
    background: #f1f5f9; flex-shrink: 0; border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 11px;
    overflow: hidden;
  }
  .item .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .item .info { flex: 1; min-width: 0; }
  .item .info .fname { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .info .furl { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .info .status { font-size: 12px; margin-top: 2px; }
  .item .info .status.ok { color: var(--ok); }
  .item .info .status.err { color: var(--danger); }
  .item .actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }
  .btn {
    border: 1px solid var(--border); background: #fff; color: var(--text);
    padding: 7px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; transition: all .15s;
  }
  .btn:hover { border-color: var(--primary); color: var(--primary); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
    background: #111827; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: all .25s; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.ok { background: var(--ok); }
  .toast.err { background: var(--danger); }
  .note { margin-top: 18px; color: var(--muted); font-size: 12px; line-height: 1.8; }
  .url-section { margin-top: 16px; }
  .url-bar { display: flex; gap: 8px; }
  .url-bar input {
    flex: 1; padding: 10px 14px; border: 2px dashed var(--border); border-radius: 12px;
    font-size: 14px; outline: none; transition: border .2s;
    background: rgba(255,255,255,.7);
  }
  .url-bar input:focus { border-color: var(--primary); }
  .url-bar button {
    padding: 10px 20px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: all .15s; white-space: nowrap;
  }
  .url-bar button:hover { box-shadow: 0 4px 12px rgba(18,175,250,.4); transform: translateY(-1px); }
  .url-bar button:disabled { opacity: .6; cursor: not-allowed; }

  @media (max-width: 520px) {
    .item { flex-wrap: wrap; }
    .item .actions { width: 100%; justify-content: flex-end; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="https://cdn.oopss.top/icon.jpg" alt="Brandon" />
    <div>
      <div class="t">Brandon's Blog 图床</div>
      <div class="s">上传图片，自动生成 jsd.oopss.top 链接</div>
    </div>
  </header>

  <div class="dropzone" id="dropzone">
    <div class="big">🖼</div>
    <h2>点击选择 / 拖拽图片到此处</h2>
    <p>支持 png / jpg / gif / webp / svg 等常见格式，可一次上传多张</p>
    <span class="btn-select" id="pick-btn">选择图片</span>
  </div>
  <input type="file" id="file-input" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml,image/avif,image/bmp,image/x-icon" multiple style="display:none" />

  <div class="url-section">
    <div class="url-bar">
      <input type="url" id="url-input" placeholder="粘贴外部图片链接，如 https://example.com/image.jpg" />
      <button id="url-upload-btn" onclick="uploadUrl()">📥 上传</button>
    </div>
  </div>

  <div class="queue" id="queue"></div>

  <div class="note">
    <b>说明：</b>上传的图片将保存到 blogimg 仓库的 <code>uploads/年份/</code> 目录，链接格式如
    <code>jsd.oopss.top/uploads/2026/08010001.png</code>。可复制直链，或复制 Markdown 格式直接粘贴进文章。
    单文件建议 80MB 以内（受平台限制）。当前页面无需登录。
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const IMG_EXTS = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'avif', 'bmp', 'ico'];
const dz = document.getElementById('dropzone');
const fi = document.getElementById('file-input');
const queue = document.getElementById('queue');

dz.addEventListener('click', () => fi.click());
document.getElementById('pick-btn').addEventListener('click', (e) => { e.stopPropagation(); fi.click(); });
fi.addEventListener('change', () => { handleFiles(fi.files); fi.value = ''; });

['dragover', 'dragenter'].forEach((ev) =>
  dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add('over'); }));
['dragleave', 'drop'].forEach((ev) =>
  dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove('over'); }));
// 阻止在页面任意位置拖放图片时浏览器直接打开图片/导航
['dragover', 'drop'].forEach((ev) =>
  document.addEventListener(ev, (e) => e.preventDefault()));
dz.addEventListener('drop', (e) => {
  const files = Array.from((e.dataTransfer || {}).files || []);
  if (files.length) handleFiles(files);
});

function handleFiles(files) {
  Array.from(files).forEach((f, i) => setTimeout(() => uploadFile(f), i * 150));
}

function extOk(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  return IMG_EXTS.includes(ext);
}

// 本地过大图片先在浏览器端压缩，避免上传到 worker 后 WebP 转换 CPU 超时(1102)
// 仅在图片尺寸或体积超限且有浏览器可解码能力时压缩；gif/svg/动图等跳过
const COMPRESS_MAX_EDGE = 1280;   // 最长边超过此值则缩放
const COMPRESS_MAX_BYTES = 2 * 1024 * 1024; // 体积超过 2MB 也压缩
const COMPRESS_QUALITY = 0.8;

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('无法解码图片')); };
    img.src = url;
  });
}

async function compressImage(file) {
  if (!file || !file.type) return file;
  const t = (file.type || '').toLowerCase();
  // 只压缩可安全重编码的位图；gif(含动图)/svg/ico 跳过
  if (!['image/jpeg', 'image/png', 'image/webp'].includes(t)) return file;
  // 体积不大且尺寸未知时，保守起见直接上传
  if (file.size <= COMPRESS_MAX_BYTES && file.size > 0) return file;

  try {
    const img = await loadImage(file);
    const longEdge = Math.max(img.naturalWidth, img.naturalHeight);
    // 尺寸也不超限则直接上传
    if (longEdge <= COMPRESS_MAX_EDGE && file.size <= COMPRESS_MAX_BYTES) return file;

    let w = img.naturalWidth;
    let h = img.naturalHeight;
    if (longEdge > COMPRESS_MAX_EDGE) {
      const scale = COMPRESS_MAX_EDGE / longEdge;
      w = Math.round(w * scale);
      h = Math.round(h * scale);
    }
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    const canWebp = typeof HTMLCanvasElement.prototype.toBlob === 'function' &&
      document.createElement('canvas').toDataURL('image/webp').indexOf('data:image/webp') === 0;
    const mime = canWebp ? 'image/webp' : 'image/jpeg';
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, mime, COMPRESS_QUALITY));
    if (!blob) return file;
    const newName = file.name.replace(/\.[^.]+$/, '') + (canWebp ? '.webp' : '.jpg');
    return new File([blob], newName, {type: mime});
  } catch {
    return file;
  }
}

let toastTimer;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.className = 'toast'), 2600);
}

function addItem(file) {
  const div = document.createElement('div');
  div.className = 'item uploading';
  div.innerHTML = `
    <div class="thumb">上传中</div>
    <div class="info">
      <div class="fname"></div>
      <div class="status">准备上传…</div>
      <div class="furl" style="display:none"></div>
    </div>
    <div class="actions">
      <button class="btn cp-url" disabled>复制链接</button>
      <button class="btn cp-md" disabled>复制 Markdown</button>
    </div>`;
  // fname 在 uploadFile 中设置
  queue.prepend(div);
  return div;
}

async function uploadFile(file, externalUrl) {
  if (!extOk(file.name)) {
    const d = addItem(file);
    d.querySelector('.status').textContent = '不支持该格式';
    d.querySelector('.status').classList.add('err');
    d.querySelector('.thumb').textContent = '✕';
    d.classList.remove('uploading');
    return;
  }
  const div = addItem(file);
  const displayName = externalUrl || file.name;
  div.querySelector('.fname').textContent = displayName;
  const status = div.querySelector('.status');
  const urlEl = div.querySelector('.furl');

  // 本地文件：图片过大的话先在浏览器端压缩，避免上传后 worker 转换超时
  let uploadFileObj = file;
  if (!externalUrl) {
    status.textContent = '压缩图片中…';
    uploadFileObj = await compressImage(file);
    if (uploadFileObj !== file) {
      status.textContent = '已压缩，上传中…';
    }
  }

  status.textContent = '分配链接中…';

  const ext = (uploadFileObj.name.split('.').pop() || '').toLowerCase();

  // 1. 先预分配预计链接（gif→gif，其余→webp），立即显示
  let expectedUrl = '';
  let reserveInfo = null;
  try {
    const rr = await fetch('/upload/reserve?ext=' + encodeURIComponent(ext), {method: 'POST'});
    const rj = await rr.json();
    if (!rr.ok || !rj.ok) throw new Error(rj.error || '链接分配失败 (' + rr.status + ')');
    expectedUrl = rj.url;
    reserveInfo = rj;
    div.querySelector('.furl').textContent = expectedUrl;
    div.querySelector('.furl').style.display = 'block';
    status.textContent = '预计链接已分配，上传中…';
  } catch (e) {
    status.textContent = '✕ ' + e.message;
    status.classList.add('err');
    div.querySelector('.thumb').textContent = '✕';
    div.classList.remove('uploading');
    toast('链接分配失败: ' + e.message, 'err');
    return;
  }

  // 2. 实际上传（携带预留信息，使后端复用同一序号）
  const fd = new FormData();
  if (externalUrl) {
    fd.append('url', externalUrl);
  } else {
    fd.append('file', uploadFileObj);
  }
  if (reserveInfo) {
    fd.append('reservedBase', reserveInfo.base);
    fd.append('reservedFolder', reserveInfo.folder);
    fd.append('reservedYyyy', String(reserveInfo.yyyy));
  }
  try {
    const apiUrl = externalUrl ? '/api/upload/url' : '/api/upload';
    const r = await fetch(apiUrl, {method: 'POST', body: fd});
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || '上传失败 (' + r.status + ')');

    // 上传失败也会占用序号（KV 已自增），即使成功也走这里
    status.textContent = '✓ 上传成功';
    status.classList.add('ok');
    const thumb = div.querySelector('.thumb');
    thumb.innerHTML = '';
    const img = document.createElement('img');
    img.src = j.url || expectedUrl;
    img.alt = '';
    thumb.appendChild(img);

    const finalUrl = j.url || expectedUrl;
    urlEl.textContent = finalUrl;
    urlEl.style.display = 'block';

    const cpUrl = div.querySelector('.cp-url');
    const cpMd = div.querySelector('.cp-md');
    cpUrl.disabled = false;
    cpMd.disabled = false;
    const mdName = displayName.replace(/\.[^.]+$/, '') || 'image'; const mdText = `![${mdName.replace(/[^\w\u4e00-\u9fa5-]+/g, '-')}](${finalUrl})`;
    cpUrl.onclick = async () => { await copy(finalUrl); };
    cpMd.onclick = async () => { await copy(mdText); };
    div.classList.remove('uploading');
    toast('上传成功 ✓', 'ok');
  } catch (e) {
    // 序号已占用，即使失败也不复用
    status.textContent = '✕ ' + e.message;
    status.classList.add('err');
    div.querySelector('.thumb').textContent = '✕';
    div.classList.remove('uploading');
    toast('上传失败: ' + e.message, 'err');
  }
}

async function uploadUrl() {
  const inp = document.getElementById('url-input');
  const url = inp.value.trim();
  if (!url) { toast('请粘贴图片链接', 'err'); return; }
  inp.value = '';
  // 用 URL 作为"文件名"提取扩展名
  const urlPath = url.split('?')[0];
  const name = urlPath.split('/').pop() || 'image';
  const fakeFile = { name: name };
  await uploadFile(fakeFile, url);
}

async function copy(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast('已复制 ✓', 'ok');
  } catch {
    // 回退方案
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    toast('已复制 ✓', 'ok');
  }
}
</script>
</body>
</html>
